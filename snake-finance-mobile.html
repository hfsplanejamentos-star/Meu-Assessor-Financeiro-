/* v4 mobile — gráficos de pizza/rosca e legendas clicáveis */

<script id="v73-safe-card-navigation">
(function(){
  function safeCall(name){
    try{
      var fn=window[name];
      if(typeof fn==='function'){ fn(); return true; }
    }catch(e){ console.warn('Snake Finance navigation:',name,e); }
    return false;
  }
  function safeTab(tab){
    try{
      if(typeof window.TAB!=='undefined') window.TAB=tab;
      else try{ TAB=tab; }catch(_){}
      if(typeof window.draw==='function'){ window.draw(); return true; }
    }catch(e){ console.warn('Snake Finance tab:',tab,e); }
    return false;
  }
  window.snakeSafeNavigate=function(target){
    var map={
      caju:function(){return safeCall('vCaju')||safeCall('openCaju')||safeTab('caju')},
      despesas:function(){return safeCall('vDespesas')||safeCall('openDespesas')||safeTab('des')},
      recorrentes:function(){return safeCall('vRec')||safeCall('openRecorrentes')||safeTab('rec')},
      investimentos:function(){return safeCall('vInvest')||safeTab('invest')},
      agenda:function(){return safeCall('vAgenda')||safeTab('agenda')},
      contas:function(){return safeCall('vContas')||safeTab('contas')},
      transacoes:function(){return safeCall('vTransacoes')||safeTab('transacoes')}
    };
    try{ return map[target] ? !!map[target]() : false; }
    catch(e){ console.warn('Snake Finance target:',target,e); return false; }
  };

  /* Never let a card click escape as an uncaught exception to the preview shell. */
  document.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-snake-target]');
    if(!el) return;
    ev.preventDefault(); ev.stopPropagation();
    snakeSafeNavigate(el.getAttribute('data-snake-target'));
  },true);
})();
</script>

<script id="v74-runtime-root-fixes">
/* Compatibility formatter required by detailModal. */
if(typeof window.BR!=='function'){
  window.BR=function(v){
    try{return typeof brl==='function'?brl(v):String(v)}
    catch(e){return String(v)}
  };
}

/* One safe modal API for every card/chart detail path. Accepts both modal(title, body)
   and the older modal(fullHtml) form still present in the file. */
window.modal=function(title,body){
  try{
    var md=document.getElementById('md');
    if(!md) return false;
    var oneArg=(arguments.length<2);
    var html=oneArg?String(title||''):String(body||'');
    var head=oneArg?'':('<div class="sp"><p class="h" style="font-size:1.2em">'+String(title||'Detalhes')+'</p><button class="bt" onclick="closeModal()">Fechar</button></div>');
    md.style.display='flex';
    md.innerHTML='<div class="mc">'+head+html+'</div>';
    try{MD='modal'}catch(_){}
    if(typeof v65CloseQuick==='function')v65CloseQuick();
    document.querySelector('.catFab')?.classList.add('modalHidden');
    return true;
  }catch(e){
    console.error('modal',e);
    return false;
  }
};
window.closeModal=function(){
  try{
    var md=document.getElementById('md');
    if(md){md.style.display='none';md.innerHTML='';}
    try{MD=null}catch(_){}
    document.querySelector('.catFab')?.classList.remove('modalHidden');
  }catch(e){console.error('closeModal',e)}
};
</script>

const GOAL_STORE='assessor_invest_goals_v53';let GOALS_EXAMPLE=!localStorage.getItem(GOAL_STORE);
function defaultInvestmentGoals(){return []}
function loadGoals(){
 try{
   const v=JSON.parse(localStorage.getItem(GOAL_STORE)||'null');
   return Array.isArray(v)&&v.every(g=>g&&/^[a-zA-Z0-9_-]+$/.test(g.id)&&typeof g.name==='string'&&Number.isSafeInteger(g.total)&&g.total>0&&Number.isSafeInteger(g.real)&&g.real>=0)?v:defaultInvestmentGoals();
 }catch(e){return defaultInvestmentGoals()}
}
let INVEST_GOALS=loadGoals();
function saveGoals(){try{localStorage.setItem(GOAL_STORE,JSON.stringify(INVEST_GOALS));GOALS_EXAMPLE=false;}catch(e){alert('Não foi possível salvar as metas. Exporte um backup antes de fechar.');}}

const INV_START='2026-11';
const INV_INFLATION=4.5;
let INV_CFG={aporte:0,meses:12,taxa:0,inflacao:false,goalId:''};try{const c=JSON.parse(localStorage.getItem('assessor_inv_v82')||'{}');for(const [k,min,max] of [['aporte',0,100000000],['meses',1,120],['taxa',0,100]])if(Number.isFinite(c[k])&&c[k]>=min&&c[k]<=max&&(k==='taxa'||Number.isInteger(c[k])))INV_CFG[k]=c[k];if(typeof c.inflacao==='boolean')INV_CFG.inflacao=c.inflacao;if(typeof c.goalId==='string')INV_CFG.goalId=c.goalId;}catch(e){}

function addMonthsYM(ym,n){
  let [y,m]=ym.split('-').map(Number); m=m-1+n;
  return `${y+Math.floor(m/12)}-${String((m%12+12)%12+1).padStart(2,'0')}`;
}
function invMonthlyRate(annual){
  let a=annual;
  if(INV_CFG.inflacao) a=((1+annual/100)/(1+INV_INFLATION/100)-1)*100;
  return Math.pow(1+a/100,1/12)-1;
}
function investmentProjection(annual=INV_CFG.taxa){
  let acc=activeGoal().real,aportado=acc,r=invMonthlyRate(annual),rows=[];
  for(let i=0;i<INV_CFG.meses;i++){
    const rend=Math.round(acc*r);
    aportado+=INV_CFG.aporte;
    acc=Math.round(acc+rend+INV_CFG.aporte);
    rows.push({ym:addMonthsYM(INV_START,i),aporte:INV_CFG.aporte,rend,aportado,acum:acc});
  }
  return rows;
}
function activeGoal(){return INVEST_GOALS.find(g=>g.id===INV_CFG.goalId)||INVEST_GOALS[0]||{id:'meta1',name:'Minha meta',total:3000000,real:0}}

<script id="v75-financial-repair">
const CAJU_CFG_KEY='assessor_caju_months_v75';
let CAJU_CFG;try{CAJU_CFG=JSON.parse(localStorage.getItem(CAJU_CFG_KEY)||'{}')}catch(e){CAJU_CFG={}};
const ORIGINAL_FUNDS=OPENING_CFG.cajuFunds;
function validISO(d){if(typeof d!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;const [y,m,n]=d.split('-').map(Number);const z=new Date(y,m-1,n,12);return z.getFullYear()===y&&z.getMonth()===m-1&&z.getDate()===n;}
function moneyInput(s){s=String(s).trim();if(!s)return NaN;const pt=s.includes(',');if(!/^-?[\d.,]+$/.test(s))return NaN;return Math.round(Number(pt?s.replace(/\./g,'').replace(',','.'):s)*100);}
function monthBefore(m){return addMonthsYM(m,-1)}
function cajuBalance(ym){
 const anchor='2026-10';let balance=0;
 if(ym<anchor&&!CAJU_CFG[ym])return 0;
 let start=ym<anchor?ym:anchor;
 for(let m=start;m<=ym;m=addMonthsYM(m,1)){
  const cfg=CAJU_CFG[m],credits=L.filter(x=>x.a==='caju'&&x.t==='r'&&x.s==='r'&&(x.comp||x.d||'').startsWith(m)).reduce((q,x)=>q+x.v,0);
  const spent=L.filter(x=>x.a==='caju'&&x.t!=='r'&&x.s==='r'&&(x.comp||x.d||'').startsWith(m)).reduce((q,x)=>q+x.v,0);
  let opening=cfg&&Number.isInteger(cfg.opening)?cfg.opening:(m===anchor?ORIGINAL_FUNDS:balance);
  // Actual credits replace the default forecast; configured credit amounts are already represented in credits.
  const incoming=L.filter(x=>x.to==='caju'&&x.a!=='caju'&&x.t==='t'&&x.s==='r'&&(x.comp||x.d||'').startsWith(m)).reduce((q,x)=>q+x.v,0);const reload=credits+(incoming||0)||(cfg?cfg.reload:0)||0;
  balance=opening+reload-spent;
 }
 return balance;
}
function openCajuSettings(){
 const cfg=CAJU_CFG[YM];const prev=cfg&&Number.isInteger(cfg.opening)?cfg.opening:(YM==='2026-10'?ORIGINAL_FUNDS:YM<'2026-10'?0:cajuBalance(monthBefore(YM)));
 const actual=ML().filter(x=>x.a==='caju'&&x.t==='r'&&x.s==='r').reduce((q,x)=>q+x.v,0);
 modal('Caju · '+monthName(YM),`<p class="m">${YM==='2026-10'&&!cfg?'Informe o saldo anterior e a recarga do mês, ou importe seu backup completo.':'Saldo anterior + recarga do mês − despesas realizadas.'}</p><div class="fm"><label>${YM==='2026-10'&&!cfg?'Saldo inicial conciliado':'Saldo anterior (R$)'}<input id="cj_open" value="${(prev/100).toFixed(2).replace('.',',')}" inputmode="decimal"></label><label>Recarga do mês (R$)<input id="cj_reload" value="${((actual||(cfg?cfg.reload:0))/100).toFixed(2).replace('.',',')}" inputmode="decimal"></label><button class="bt p" onclick="saveCajuSettings()">Salvar</button><button class="bt" onclick="resetCajuSettings()">Usar saldo anterior calculado</button></div>`);

 CAJU_CFG[YM]={opening,reload};
 const credits=ML().filter(x=>x.a==='caju'&&x.t==='r'&&x.s==='r');
 if(credits.length){alert('Há recargas realizadas neste mês. Edite os lançamentos para alterar o total da recarga; eles têm prioridade sobre o valor configurado.');}

function projectedC6(ym){return accountBalance('c6',ym+'-31',true)}
function recurrenceKey(x){const n=String(x.n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();const key=x.series||(/pensao/.test(n)?'pension':/aluguel/.test(n)?'rent':/conta de luz|enel|energia eletrica/.test(n)?'power':/internet/.test(n)?'internet':/plano tim/.test(n)?'tim':n);return key+'|'+x.t;}
function ensureRecurrences(ym){
 if(!/^\d{4}-\d{2}$/.test(ym)||ym<'2027-01'||ym>'2036-12'||PERSIST_BLOCKED)return;
 let changed=false;
 for(let m='2027-01';m<=ym;m=addMonthsYM(m,1)){
  const map=new Map();L.filter(x=>x.rc&&(x.comp||x.d).slice(0,7)<m).slice().sort((a,b)=>(a.comp||a.d).localeCompare(b.comp||b.d)||a.d.localeCompare(b.d)).forEach(x=>map.set(recurrenceKey(x),x));
  for(const [key,t]of map){if(L.some(x=>x.rc&&(x.comp||x.d).startsWith(m)&&recurrenceKey(x)===key))continue;
   let day=Math.min(Number(t.dv)||Number(t.d.slice(-2)),new Date(+m.slice(0,4),+m.slice(5),0).getDate());
   if(t.t==='r'&&/sal[aá]rio/i.test(t.n)){let dt=new Date(+m.slice(0,4),+m.slice(5),0);while([0,6].includes(dt.getDay()))dt.setDate(dt.getDate()-1);day=dt.getDate();}
   L.push({...t,id:nextId(),series:t.series||key.slice(0,key.lastIndexOf('|')),d:m+'-'+String(day).padStart(2,'0'),comp:m+'-01',s:'p',dv:day});changed=true;
  }
 }

  }
  window.reviewNativeNotifications=function(){window.meuAssessorAndroidAutoSync();activeSource='bank';modal('Notificações bancárias',body('bank'));MD='capture-inbox';};
  window.captureRefresh=async function(source,silent=false){if(loading)return;loading=true;if(source==='whatsapp')lastWaFetch=Date.now();try{if(source==='bank')window.meuAssessorAndroidAutoSync();else{const result=await api('/whatsapp/messages');waItems=Array.isArray(result.messages)?result.messages.filter(m=>typeof m.messageId==='string'&&typeof m.text==='string'&&Number.isFinite(m.postedAt)).slice(0,50).map(m=>({...m,connection:connectionGeneration})):[];}if(source==='bank'){window.reviewNativeNotifications();}else{AS='wa';draw();}}catch(error){if(silent){connectionMessage=error.message;if(TAB==='as'&&AS==='wa'&&!MD)draw();}else alert(error.message);}finally{loading=false;}};
  async function acknowledge(items,action){

  async function complete(items,action){if(busy)return;busy=true;try{await acknowledge(items,action);if(items[0]?.source==='bank')window.reviewNativeNotifications();else{AS='wa';draw();}}catch(error){alert(error.message);}finally{busy=false;}}
  window.captureClear=async function(source){const snapshot=reviewItems.filter(e=>e.source===source).map(e=>({...e}));if(!snapshot.length||!confirm(`Limpar ${snapshot.length} notificações pendentes? Os lançamentos já salvos serão mantidos.`))return;await complete(snapshot,'discarded');};
  window.captureDiscard=async function(index){const e=reviewItems[index];if(!e||!confirm('Dispensar esta notificação? Nenhum lançamento será excluído.'))return;await complete([e],'discarded');};
  function localDraft(e){
    const text=String(e.text||''),full=(e.title+' '+text).toLowerCase();let amount=e.amountCents;
    if(!Number.isSafeInteger(amount)){const match=[...text.matchAll(/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})(?!\d)/g)];if(match.length===1)amount=Math.round(Number(match[0][1].replace(/\./g,'').replace(',','.'))*100);}
    const direction=['expense','income'].includes(e.direction)?e.direction:/\b(recebi|recebido|salário|salario|entrada)\b/.test(full)?'income':/\b(gastei|paguei|compra|comprou|pagamento|despesa|débito|debito)\b/.test(full)?'expense':'unknown';
    const account=/caju/.test(full+' '+(e.sourcePackage||''))?'caju':/c6/.test(full+' '+(e.sourcePackage||''))?(/carbon|cart[aã]o|cr[eé]dito/.test(full)?'carbon':'c6'):'';
    const date=new Date(e.postedAt),day=Number.isFinite(date.getTime())?`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`:APP_TODAY;

  }
  function audioError(code){return ({audio_not_configured:'A transcrição de áudio ainda precisa ser ativada no servidor.',unsupported_audio:'Formato não compatível. Envie um áudio gravado diretamente no WhatsApp.',audio_too_large:'O áudio excede 10 MB. Envie um trecho menor.',empty_transcript:'Não foi possível reconhecer a fala. Tente um áudio mais claro.',transcript_too_long:'A transcrição ficou muito longa. Envie um áudio mais curto.',media_unavailable:'O áudio não está disponível para download. Tente novamente ou reenvie.',audio_checksum_mismatch:'O arquivo recebido não passou na verificação. Reenvie o áudio.'})[code]||'A transcrição não foi concluída. Tente novamente.';}
  window.captureRetryAudio=async function(index){if(busy)return;const event=reviewItems[index];if(!event||event.kind!=='audio'||event.status!=='failed'||event.connection!==connectionGeneration)return;busy=true;try{await api('/whatsapp/retry','POST',{messageId:event.id});await window.captureRefresh('whatsapp');}catch(error){alert(error.message);}finally{busy=false;}};

  function showDraft(){
    if(!draft)return;const d=draft.data;
    modal(draft.event.kind==='audio'?'Revisar gasto do áudio':'Revisar gasto capturado',`<p class="m">${safe(draft.event.source==='bank'?'Notificação bancária':'Mensagem do WhatsApp')} · Confirme os dados abaixo.</p>${draft.event.kind==='audio'?'<div class="c" style="margin:12px 0"><b>Transcrição do áudio</b><p style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:130px;overflow:auto">'+safe(draft.event.text)+'</p><p class="m">Confira a transcrição e as sugestões antes de salvar.</p></div>':''}${draft.note?'<p class="m">'+safe(draft.note)+'</p>':''}<div class="fm"><label>Tipo<select id="capture-type"><option value="">Selecione</option><option value="d" ${d.type==='d'?'selected':''}>Despesa</option><option value="r" ${d.type==='r'?'selected':''}>Receita</option></select></label><label>Descrição<input id="capture-name" maxlength="250" value="${safe(d.name)}"></label><label>Valor (R$)<input id="capture-amount" inputmode="decimal" value="${d.amount?(d.amount/100).toFixed(2).replace('.',','):''}"></label><label>Data<input id="capture-date" type="date" value="${safe(d.day)}"></label><label>Conta<select id="capture-account"><option value="">Selecione a conta</option>${['c6','caju','carbon'].map(k=>`<option value="${k}" ${d.account===k?'selected':''}>${safe(AC[k][0])}</option>`).join('')}</select></label><label>Categoria<select id="capture-category" onchange="document.getElementById('capture-sub').innerHTML=subOptions(this.value)">${Object.keys(CATDB).map(k=>`<option value="${safe(k)}" ${d.category===k?'selected':''}>${safe(catName(k))}</option>`).join('')}</select></label><label>Subcategoria<select id="capture-sub">${subOptions(d.category)}</select></label><p class="m">Receitas não recebem categoria de despesa. Você pode corrigir todos os campos.</p>${config.configured?'<button class="bt" onclick="captureClassify()">Sugerir categoria com IA</button>':''}</div><div class="captureActions" style="position:sticky;bottom:-16px;padding:12px 0;background:var(--card);display:grid;gap:8px;z-index:2"><button id="capture-save" class="bt p" onclick="captureSave()">Salvar lançamento</button><button class="bt" onclick="closeDay()">Cancelar e manter pendente</button></div>`);MD='capture-draft';

  function readDraft(){const value=document.getElementById('capture-amount').value.trim().replace(/\./g,'').replace(',','.');return {type:document.getElementById('capture-type').value,name:document.getElementById('capture-name').value.trim(),amount:Math.round(Number(value)*100),day:document.getElementById('capture-date').value,account:document.getElementById('capture-account').value,category:document.getElementById('capture-category').value,sub:document.getElementById('capture-sub').value};}
  window.captureSave=async function(){
    if(busy||!draft)return;const event=draft.event,d=readDraft();
    if(!['r','d'].includes(d.type)||!d.name||!Number.isSafeInteger(d.amount)||d.amount<=0||!validISO(d.day)||!AC[d.account]||(d.type==='r'&&d.account==='carbon')||(d.type==='d'&&!CATDB[d.category])){alert('Confirme tipo, descrição, valor, data, conta e categoria.');return;}

    }catch(error){alert(error.message);}finally{busy=false;if(button)button.disabled=false;}
  };
  function applyAi(result,current){
    if(result?.intent!=='transaction'||!result.draft||typeof result.draft.value!=='number'||!Number.isFinite(result.draft.value)||!Number.isSafeInteger(Math.round(Math.abs(result.draft.value)*100))||Math.abs(result.draft.value)<=0||!validISO(result.draft.date)||typeof result.draft.desc!=='string'||result.draft.desc.length>250)throw Error('A IA não identificou um lançamento válido. Revise os dados manualmente.');

  window.captureClassify=async function(){if(busy||!draft)return;busy=true;const current=readDraft(),event=draft.event;try{const result=await api('/ai/finance','POST',{text:'Interprete esta mensagem como um rascunho para revisão: '+String(event.text||event.title).slice(0,3500),context:{today:current.day,categories:aiContext().categories}});if(MD!=='capture-draft'||draft?.event!==event)return;draft.data=applyAi(result,current);showDraft();}catch(error){alert(error.message);}finally{busy=false;}};
  window.captureBankPermissions=function(){bridge?.openCaptureSettings?.();};
  window.captureSettings=function(){loadConfig();document.getElementById('settingsPop')?.classList.remove('on');modal('Captura, WhatsApp e IA',`<div class="fm"><p>Notificações bancárias: ${native?'disponíveis neste Android':'disponíveis no aplicativo Android'}.</p>${native?'<button class="bt" onclick="captureBankPermissions()">Permissões dos bancos</button><button class="bt" onclick="reviewNativeNotifications()">Revisar notificações</button>':''}<p class="m">WhatsApp e IA precisam de um serviço conectado. A chave da IA fica no servidor.</p><label>Endereço do serviço<input id="capture-url" type="url" placeholder="https://seu-servico.convex.site" value="${safe(config.url)}"></label><label>Chave de acesso<input id="capture-key" type="password" autocomplete="off" placeholder="${config.configured?'Preencha somente para trocar a conexão':'Chave fornecida para sua conta'}"></label><button class="bt p" onclick="captureConnect()">Conectar e verificar</button><button class="bt" onclick="captureDisconnect()">Desconectar serviço</button><p id="capture-status" class="m">${safe(connectionMessage||'Conexão ainda não verificada.')}</p><p class="m">No Android, a chave é protegida no aparelho. No navegador, a conexão dura esta sessão. Mensagens de texto e áudio são revisadas antes de virar lançamentos.</p></div>`);MD='capture-settings';};

    document.getElementById('capture-key').value='';status=await api('/integrations/status');connectionMessage=`Serviço conectado · WhatsApp: ${status.whatsapp?'configurado':'aguardando ativação'} · IA: ${status.ai?'configurada':'aguardando ativação'} · Áudio: ${status.audio?'configurado':'aguardando ativação'}`;

  window.captureDisconnect=function(){if(busy)return;if(!confirm('Desconectar WhatsApp e IA neste aparelho? Seus lançamentos serão mantidos.'))return;if(bridge?.clearIntegrationConfig&&!bridge.clearIntegrationConfig()){alert('Não foi possível desconectar.');return;}connectionGeneration++;sessionKey='';config={url:'',configured:false};waItems=[];status=null;connectionMessage='Serviço desconectado.';window.captureSettings();};
  window.captureAsk=async function(){if(busy)return;const text=document.getElementById('capture-question')?.value.trim();if(!text||text.length>3500)return;busy=true;try{const result=await api('/ai/finance','POST',{text,context:aiContext()});if(result.intent==='transaction'){if(!ST.msg)throw Error('Ative Registrar despesas por mensagem em Avisos para abrir rascunhos.');const e={source:'manual',id:'ai_'+Date.now()+'_'+(++requestNumber),title:'Rascunho por IA',text,postedAt:Date.now()};draft={event:e,data:applyAi(result,localDraft(e))};showDraft();}else if(result.intent==='answer'&&typeof result.answer==='string'&&result.answer.length<=12000){answers.push({question:text,answer:result.answer});answers=answers.slice(-10);AS='chat';draw();}else throw Error('A IA retornou uma resposta inválida.');}catch(error){alert(error.message);}finally{busy=false;}};

  window.clearAdvisorNotices=function(){const snapshot=financialAlerts(YM).map(signature);if(!snapshot.length||!confirm('Limpar os avisos exibidos hoje? Os lançamentos serão mantidos. Avisos voltam amanhã ou quando a situação mudar.'))return;const updated=[...new Set([...dismissed,...snapshot])].slice(-500);try{localStorage.setItem(noticeDismissKey,JSON.stringify(updated));dismissed=updated;draw();}catch{alert('Não foi possível salvar a limpeza dos avisos.');}};

  const previousAs=vAs;

    if(AS==='wa'){activeSource='whatsapp';if(config.configured&&Date.now()-lastWaFetch>15000&&!loading)setTimeout(()=>window.captureRefresh('whatsapp',true),0);return tabs+`<div class="c"><h2>Gastos recebidos</h2><p class="m">Texto e áudio transcrito. Nada é registrado sem sua confirmação.</p>${body('whatsapp')}</div>`;}

  };

  window.meuAssessorAndroidAutoSync();
})();
