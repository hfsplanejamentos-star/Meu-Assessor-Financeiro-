name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal
    paths:
      - 'captura-android/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: captura-android

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permissao ao Gradle
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Assessor-Financeiro-Android
          path: captura-android/app/build/outputs/apk/debug/app-debug.apk
