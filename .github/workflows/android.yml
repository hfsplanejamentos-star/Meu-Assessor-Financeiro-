name: Criar APK para Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Mostrar estrutura do projeto
        run: |
          echo "=== RAIZ ==="
          pwd
          ls -la
          echo "=== CAPTURA ANDROID ==="
          find . -maxdepth 3 -type f | sort

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar projeto Android
        run: |
          echo "Conteudo da pasta:"
          ls -la captura-android || true
          echo "Arquivos Gradle encontrados:"
          find captura-android -maxdepth 3 -type f -iname "*gradle*" -print || true
