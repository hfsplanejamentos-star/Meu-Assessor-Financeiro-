name: Criar APK para Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: android-capture
        run: gradle assembleDebug

      - name: Localizar APK
        run: find android-capture -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Assessor-Financeiro-Android
          path: android-capture/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
