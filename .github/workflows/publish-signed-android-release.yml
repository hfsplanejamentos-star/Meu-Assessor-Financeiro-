name: Publish Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-capture
    env:
      ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/meu-assessor-release.p12
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed release
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" "app/build/outputs/apk/release/Meu-Assessor-Financeiro-IA-v1.2.0.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Assessor-Financeiro-IA-v1.2.0-SIGNED
          path: android-capture/app/build/outputs/apk/release/Meu-Assessor-Financeiro-IA-v1.2.0.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v1.2.0" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v1.2.0"             "app/build/outputs/apk/release/Meu-Assessor-Financeiro-IA-v1.2.0.apk"             --repo "${{ github.repository }}"             --title "Meu Assessor Financeiro IA 1.2.0"             --notes "Versão completa assinada: atualização no app, gesto nativo de voltar, câmera, voz, WhatsApp, ícone personalizado e captura bancária."
