name: Publish Signed Android Release (manual and protected)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.5.8 (must match build.gradle.kts)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signed-snake-finance-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-capture
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      ANDROID_KEYSTORE_FILE: /tmp/snake-finance-release.p12
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release is new and version is explicit
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version"; exit 1; }
          grep -Eq "versionName = \"$RELEASE_VERSION\"" app/build.gradle.kts || { echo "Gradle versionName mismatch"; exit 1; }
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing GitHub release"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            echo "Refusing to overwrite an existing Git tag"
            exit 1
          fi

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned backend dependencies
        working-directory: .
        run: npm ci

      - name: Complete pre-release security and financial audit
        working-directory: .
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:backend
          node tests/android-capture-audit.cjs
          node tests/snake-finance-regression.cjs
          node tests/snake-backup-export-regression.cjs

      - name: Android unit tests and signed release build
        run: |
          set -euo pipefail
          gradle testDebugUnitTest assembleRelease --stacktrace

      - name: Verify package, version and original release signing identity
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:"
          echo "$BADGING" | grep -Fq "name='br.com.snakefinance.app'"
          echo "$BADGING" | grep -Fq "versionName='$RELEASE_VERSION'"
          VERSION_CODE="$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -gt 31 || { echo "Production update must have versionCode > 31"; exit 1; }

          mkdir -p /tmp/snake-original-signed
          gh release download v1.5.7 -p 'Snake-Finance-v1.5.7.apk' -D /tmp/snake-original-signed --repo "$GITHUB_REPOSITORY"
          PREVIOUS="/tmp/snake-original-signed/Snake-Finance-v1.5.7.apk"
          test -s "$PREVIOUS"
          PRIOR_SHA="$("$APKSIGNER" verify --print-certs "$PREVIOUS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          NEW_SHA="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$PRIOR_SHA"
          test -n "$NEW_SHA"
          test "$PRIOR_SHA" = "$NEW_SHA" || { echo "SIGNING CERTIFICATE CHANGED: aborting update"; exit 1; }

          cp "$APK" "app/build/outputs/apk/release/Snake-Finance-v$RELEASE_VERSION.apk"

      - name: Upload signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Finance-${{ inputs.version }}-SIGNED
          path: android-capture/app/build/outputs/apk/release/Snake-Finance-v${{ inputs.version }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish new release without deleting old releases
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" "app/build/outputs/apk/release/Snake-Finance-v$RELEASE_VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Snake Finance $RELEASE_VERSION" \
            --notes "Signed in-place update. Keep previous release available as recovery reference."
