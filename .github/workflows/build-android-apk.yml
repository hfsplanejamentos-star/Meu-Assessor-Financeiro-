name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, snake-finance-ota-1.4.12, validacao-xp-infinite-one-20261015]
    paths:
      - "android-capture/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-capture
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Snake-Finance-XP-Validacao.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Finance-XP-Validacao-APK
          path: android-capture/app/build/outputs/apk/debug/Snake-Finance-XP-Validacao.apk
          if-no-files-found: error
          retention-days: 30
