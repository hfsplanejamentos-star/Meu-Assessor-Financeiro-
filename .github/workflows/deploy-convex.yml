name: Deploy Convex Backend (manual review)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-convex-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Audit backend and types before any deployment
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:backend
          node tests/snake-finance-regression.cjs
          node tests/snake-backup-export-regression.cjs

      - name: Deploy only with explicit server secret
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$CONVEX_DEPLOY_KEY" || { echo "Missing server deployment credential"; exit 1; }
          npx convex deploy
