name: Assessor IA checks
on:
  push:
    branches:
      - feature/assessor-ia-mobile
  pull_request:
    paths:
      - "convex/**"
      - "assessor-*.js"
      - "assessor-*.html"
      - "assessor-brand-assets.css"
      - "Assessor_IA_Mobile_Validacao_Standalone.html"
      - "scripts/build-assessor-standalone.cjs"
      - "tests/assessor-*"
      - "tests/android-capture-audit.cjs"
      - "android-capture/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/assessor-ci.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Confirm standalone HTML matches current approved UI modules
        run: npm run check:assessor-html
      - name: Run Assessor UI and financial regression tests before Convex setup
        run: npm run test:assessor
      - name: Upload standalone HTML after successful tests
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Finance-Assessor-IA-HTML-Validacao
          path: Assessor_IA_Mobile_Validacao_Standalone.html
          if-no-files-found: error
          retention-days: 14
      - name: Generate Convex types in ephemeral local backend (never production)
        env:
          CONVEX_DEPLOYMENT: ""
          CONVEX_DEPLOY_KEY: ""
          CI: "true"
        run: npx convex dev --once --typecheck disable
      - run: npm run typecheck

  android-native:
    name: Android capture validation (debug only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android API 35 toolchain
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Android unit tests and debug build
        working-directory: android-capture
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify isolated and unsigned release protection
        run: |
          test -f android-capture/app/build/outputs/apk/debug/app-debug.apk
          grep -F 'applicationIdSuffix = ".ia.preview"' android-capture/app/build.gradle.kts
          grep -F 'SNAKE_ASSESSOR_PREVIEW_ONLY=true' android-capture/app/build.gradle.kts
      - name: Save test APK for manual Android validation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Finance-Assessor-IA-preview-only
          path: android-capture/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
