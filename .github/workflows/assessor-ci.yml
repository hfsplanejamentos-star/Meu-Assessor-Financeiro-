name: Assessor IA checks
on:
  push:
    branches:
      - feature/assessor-ia-mobile
  pull_request:
    paths:
      - "convex/**"
      - "assessor-*.js"
      - "assessor-*.html"
      - "tests/assessor-*"
      - "tests/android-capture-audit.cjs"
      - "android-capture/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/assessor-ci.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:assessor

  android-native:
    name: Android capture validation (debug only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android API 35 toolchain
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Android unit tests and debug build
        working-directory: android-capture
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify isolated and unsigned release protection
        run: |
          test -f android-capture/app/build/outputs/apk/debug/app-debug.apk
          grep -F 'applicationIdSuffix = ".ia.preview"' android-capture/app/build.gradle.kts
          grep -F 'SNAKE_ASSESSOR_PREVIEW_ONLY=true' android-capture/app/build.gradle.kts
      - name: Save test APK for manual Android validation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Finance-Assessor-IA-preview-only
          path: android-capture/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
