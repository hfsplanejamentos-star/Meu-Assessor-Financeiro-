name: Assessor IA checks
on:
  push:
    branches:
      - feature/assessor-ia-mobile
  pull_request:
    paths:
      - "convex/**"
      - "assessor-*.js"
      - "assessor-*.html"
      - "tests/assessor-*"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/assessor-ci.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:assessor
