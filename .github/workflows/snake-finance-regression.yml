name: Snake Finance Regression
on:
  pull_request:
    paths:
      - "snake-finance-mobile.html"
      - "android-capture/app/src/main/assets/snake-finance-mobile.html"
      - "tests/**"
      - ".github/workflows/snake-finance-regression.yml"
  push:
    branches: [main]
    paths:
      - "tests/snake-finance-regression.cjs"
      - "snake-finance-mobile.html"
      - "android-capture/app/src/main/assets/snake-finance-mobile.html"
      - ".github/workflows/snake-finance-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Financial and UI logic regression
        run: |
          node tests/snake-finance-regression.cjs
          node tests/briefing-backup-regression.cjs
