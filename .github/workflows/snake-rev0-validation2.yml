name: Snake Finance Rev0 APK validation2
on:
  workflow_dispatch:
  push:
    branches:
      - snake-finance-oficial-rev-0
    paths:
      - 'android-capture/app/src/main/assets/snake-finance-mobile.html'
      - '.github/workflows/snake-rev0-validation2.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validar painel embarcado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-capture/app/src/main/assets/snake-finance-mobile.html')
          s=p.read_text(encoding='utf-8')
          assert 'window.SNAKE_DISTRIBUTABLE=true' in s
          assert __import__('hashlib').sha256(p.read_bytes()).hexdigest() == '534fcd117dde793724a5852c765109420c2c7a02c31e270076ebcf91574df778', 'HTML Auditoria 31 nao corresponde ao arquivo validado; compilacao bloqueada'
          print('Painel de conciliação presente')
          PY
      - name: Ajustar carregador para HTML Rev0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-capture/app/src/main/java/br/com/meuassessor/capture/MainActivity.java')
          s=p.read_text()
          old='html.contains("Snake Finance Mobile — V84 · Visual aprovado")'
          assert old in s, 'Carregador Android inesperado; revisão necessária'
          s=s.replace(old,'html.contains("window.SNAKE_DISTRIBUTABLE=true")',1)
          p.write_text(s)
          PY
      - name: Isolar identificacao e atualizacoes da versao de teste
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-capture/app/src/main/java/br/com/meuassessor/capture/UpdateChecker.java')
          s=p.read_text()
          old='static void check(Activity activity) {'
          assert old in s
          s=s.replace(old,old+'\n        if (!"br.com.snakefinance.app".equals(activity.getPackageName())) return;',1)
          p.write_text(s)
          p=Path('android-capture/app/build.gradle.kts')
          s=p.read_text()
          old='applicationIdSuffix = ".validation2"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'applicationIdSuffix = ".validation2.a31r4"',1))
          p=Path('android-capture/app/src/validation2/AndroidManifest.xml')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <application android:label="Snake Finance Rev. 0 - Teste R4" tools:replace="android:label" />
          </manifest>
          ''')
          PY
      - name: Build validation2
        working-directory: android-capture
        run: gradle assembleValidation2Debug --no-daemon --stacktrace
      - name: Verificar identidade assinatura e HTML do APK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK="$(find android-capture/app/build/outputs/apk/validation2/debug -name '*.apk' -print -quit)"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='br.com.snakefinance.app.validation2.a31r4'" apk-badging.txt
          grep -q "application-label:'Snake Finance Rev. 0 - Teste R4'" apk-badging.txt
          python3 - "$APK" <<'PY'
          import hashlib, sys, zipfile
          expected = '534fcd117dde793724a5852c765109420c2c7a02c31e270076ebcf91574df778'
          with zipfile.ZipFile(sys.argv[1]) as z:
              actual = hashlib.sha256(z.read('assets/snake-finance-mobile.html')).hexdigest()
          assert actual == expected, actual
          print('APK HTML SHA-256:', actual)
          PY
          sha256sum "$APK" | tee apk-sha256.txt
          printf '%s\n' "$GITHUB_SHA" > apk-source-commit.txt
      - name: Upload verificacoes
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Finance-Rev0-Verificacoes
          path: |
            apk-signature.txt
            apk-badging.txt
            apk-sha256.txt
            apk-source-commit.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Finance-Rev0-Validacao-APK
          path: android-capture/app/build/outputs/apk/validation2/debug/*.apk
          if-no-files-found: error
