name: Snake Finance Rev0 release preparation
on:
  workflow_dispatch:
  push:
    branches:
      - snake-finance-oficial-rev-0
    paths:
      - 'android-capture/app/src/main/assets/snake-finance-mobile.html'
      - 'android-capture/app/src/main/assets/snake-graphs-3d.js'
      - 'android-capture/app/src/main/java/br/com/meuassessor/capture/*.java'
      - 'android-capture/tools/test-ledger-browser.cjs'
      - '.github/workflows/snake-rev0-validation2.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validar painel embarcado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-capture/app/src/main/assets/snake-finance-mobile.html')
          s=p.read_text(encoding='utf-8')
          assert 'window.SNAKE_DISTRIBUTABLE=true' in s
          assert __import__('hashlib').sha256(p.read_bytes()).hexdigest() == '1f269fa566ffaaad6c3ec1a7216c4f420d4594e550c7ea352d94a5f4e80e4831', 'HTML Rev0 revisao funcional 1.5.44 nao corresponde ao arquivo validado; compilacao bloqueada'
          native=Path('android-capture/app/src/main/java/br/com/meuassessor/capture/MainActivity.java')
          assert __import__('hashlib').sha256(native.read_bytes()).hexdigest() == '1ebc636d20e336af17b027dfcb388a883f9284254ca64984b70624ea1127ac1b', 'Seletor JSON nativo divergente'
          graph=Path('android-capture/app/src/main/assets/snake-graphs-3d.js')
          assert __import__('hashlib').sha256(graph.read_bytes()).hexdigest() == '6fb50fbcf783a342a9d75836de15bb3c7bdfba754cb532f4c28f2a83e6810d3d', 'Camada de cores aprovada divergente'
          assert __import__('hashlib').sha256(Path('android-capture/app/src/main/java/br/com/meuassessor/capture/BankNotificationListener.java').read_bytes()).hexdigest() == '5bec805afa6e61d4f7ee80d481f1c4373f25bbf5ec58a1b0912471cff99716ce', 'Bank capture source mismatch: BankNotificationListener.java'
          assert __import__('hashlib').sha256(Path('android-capture/app/src/main/java/br/com/meuassessor/capture/CaptureSettingsActivity.java').read_bytes()).hexdigest() == '9ce4ad416befda4ad5cac2c8791f2a03a651ce5bdee1bcb5b9352295d84b8b0a', 'Bank capture source mismatch: CaptureSettingsActivity.java'
          assert __import__('hashlib').sha256(Path('android-capture/app/src/main/java/br/com/meuassessor/capture/EncryptedQueueStore.java').read_bytes()).hexdigest() == '7db2dbbf78ad81eb415f2a7c01ca2314bc22527dc55a4a6ec8fb414bcd8a1b4a', 'Bank capture source mismatch: EncryptedQueueStore.java'
          assert __import__('hashlib').sha256(Path('android-capture/app/src/main/java/br/com/meuassessor/capture/CaptureReplayGuard.java').read_bytes()).hexdigest() == '1177ae1f66a8b43a0635a26e482818ace636e8d049f2c636c4d9d45b9acec7cc', 'Bank capture source mismatch: CaptureReplayGuard.java'
          print('Painel, captura bancária e cores aprovadas presentes')
          PY
      - name: Ajustar carregador para HTML Rev0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-capture/app/src/main/java/br/com/meuassessor/capture/MainActivity.java')
          s=p.read_text()
          old='html.contains("Snake Finance Mobile — V84 · Visual aprovado")'
          assert old in s, 'Carregador Android inesperado; revisão necessária'
          s=s.replace(old,'html.contains("window.SNAKE_DISTRIBUTABLE=true")',1)
          p.write_text(s)
          PY
      - name: Isolar identificacao e atualizacoes da versao de teste
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-capture/app/src/main/java/br/com/meuassessor/capture/UpdateChecker.java')
          s=p.read_text()
          old='static void check(Activity activity) {'
          assert old in s
          s=s.replace(old,old+'\n        if (!"br.com.snakefinance.app".equals(activity.getPackageName())) return;',1)
          p.write_text(s)
          p=Path('android-capture/app/build.gradle.kts')
          s=p.read_text()
          old='applicationIdSuffix = ".validation2"'
          assert s.count(old)==1
          s=s.replace(old,'applicationIdSuffix = ".rev0"',1)
          s=s.replace('versionCode = 31','versionCode = 68',1)
          s=s.replace('versionName = "1.5.7"','versionName = "1.5.44"',1)
          s=s.replace('versionNameSuffix = "-rev0-validation"','versionNameSuffix = "-rev0"',1)
          s=s.replace('isMinifyEnabled = true','isMinifyEnabled = false',1)
          s=s.replace('isShrinkResources = true','isShrinkResources = false',1)
          p.write_text(s)
          p=Path('android-capture/app/src/validation2/AndroidManifest.xml')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <application android:label="Snake Finance Rev. 0" tools:replace="android:label">
                  <activity android:name="br.com.meuassessor.capture.MainActivity" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/json" />
                          <data android:mimeType="text/json" />
                          <data android:mimeType="application/octet-stream" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser renderer
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Verify finance and backend
        run: |
          TZ=America/Sao_Paulo node android-capture/tools/test-functional-rev0.cjs android-capture/app/src/main/assets/snake-finance-mobile.html
          node android-capture/tools/test-daily-purchase-date.cjs
          node android-capture/tools/test-calendar-income.cjs
          npm run typecheck
          npm run test:backend
          node --experimental-strip-types tests/test-assistant-access.mjs
          node tests/test-ledger-backend.cjs
      - name: Verify assistant voice and confirmation
        run: timeout 100s node android-capture/tools/test-assistant-browser.cjs
      - name: Verify layout and daily filters
        run: |
          node android-capture/tools/verify-graphs-3d.cjs
          node android-capture/tools/test-ledger-browser.cjs
          timeout 60s node android-capture/tools/test-home-alert-swipe.cjs
          timeout 75s node android-capture/tools/test-scroll-stability.cjs
          timeout 60s node android-capture/tools/test-monthly-flow.cjs
          timeout 60s node android-capture/tools/test-cdb-transition.cjs
          timeout 60s node android-capture/tools/test-cdb-projection.cjs
          timeout 60s node android-capture/tools/test-projection-reconciliation.cjs
          timeout 60s node android-capture/tools/test-month-income-cards.cjs
          timeout 60s node android-capture/tools/test-account-invoices.cjs
          timeout 60s node android-capture/tools/test-reopen-seeds.cjs
          timeout 60s node android-capture/tools/test-flow-details.cjs
          timeout 60s node android-capture/tools/test-capture-resume.cjs
      - name: Build unsigned release
        working-directory: android-capture
        run: gradle testValidation2ReleaseUnitTest assembleValidation2Release --no-daemon --stacktrace
      - name: Verificar release e preparar ferramentas de assinatura
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK="$(find android-capture/app/build/outputs/apk/validation2/release -name '*unsigned.apk' -print -quit)"
          test -n "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='br.com.snakefinance.app.rev0' versionCode='68'" apk-badging.txt
          if grep -q '^application-debuggable' apk-badging.txt; then exit 1; fi
          python3 - "$APK" <<'PY'
          import hashlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              actual = hashlib.sha256(z.read('assets/snake-finance-mobile.html')).hexdigest()
              colors = hashlib.sha256(z.read('assets/snake-graphs-3d.js')).hexdigest()
          assert colors == '6fb50fbcf783a342a9d75836de15bb3c7bdfba754cb532f4c28f2a83e6810d3d', colors
          assert actual == '1f269fa566ffaaad6c3ec1a7216c4f420d4594e550c7ea352d94a5f4e80e4831', actual
          print('HTML Rev0 revisao funcional 1.5.44 confirmado:', actual)
          PY
          mkdir -p signing-tools
          cp "$TOOLS/lib/apksigner.jar" signing-tools/
          cp "$TOOLS/zipalign" signing-tools/
          cp "$TOOLS/aapt" signing-tools/
          cp -R "$TOOLS/lib64" signing-tools/
          sha256sum "$APK" signing-tools/apksigner.jar signing-tools/zipalign signing-tools/aapt signing-tools/lib64/* > release-input-sha256.txt
          printf '%s\n' "$GITHUB_SHA" > apk-source-commit.txt
      - name: Upload preparacao para assinatura permanente
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Finance-Rev0-Release-Preparacao
          path: |
            android-capture/app/build/outputs/apk/validation2/release/*unsigned.apk
            signing-tools/
            apk-badging.txt
            release-input-sha256.txt
            apk-source-commit.txt
            Snake_Finance_1.5.*_*.png
          if-no-files-found: error

# November fixtures use XP; October remains historical.

# Check compact-card rotation after explicit button visibility.

# Exercise mobile taps directly, without desktop focus scrolling.

# Position touch targets clear of the fixed Android navigation overlay.

# Verify drill-down opens the existing transaction editor.

# Goal cards remain independently editable; projection opening uses CDB only.