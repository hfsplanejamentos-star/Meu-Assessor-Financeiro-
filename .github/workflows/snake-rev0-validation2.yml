name: Snake Finance Rev0 APK validation2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validar painel embarcado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-capture/app/src/main/assets/snake-finance-mobile.html')
          s=p.read_text(encoding='utf-8')
          assert 'window.SNAKE_DISTRIBUTABLE=true' in s
          assert __import__('hashlib').sha256(p.read_bytes()).hexdigest() == '534fcd117dde793724a5852c765109420c2c7a02c31e270076ebcf91574df778', 'HTML Auditoria 31 nao corresponde ao arquivo validado; compilacao bloqueada'
          print('Painel de conciliação presente')
          PY
      - name: Ajustar carregador para HTML Rev0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-capture/app/src/main/java/br/com/meuassessor/capture/MainActivity.java')
          s=p.read_text()
          old='html.contains("Snake Finance Mobile — V84 · Visual aprovado")'
          assert old in s, 'Carregador Android inesperado; revisão necessária'
          s=s.replace(old,'html.contains("window.SNAKE_DISTRIBUTABLE=true")',1)
          p.write_text(s)
          PY
      - name: Build validation2
        working-directory: android-capture
        run: gradle assembleValidation2Debug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Finance-Rev0-Validacao-APK
          path: android-capture/app/build/outputs/apk/validation2/debug/*.apk
          if-no-files-found: error
