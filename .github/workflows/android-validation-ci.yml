name: Android Validation CI

on:
  pull_request:
    paths:
      - "android-capture/**"
      - ".github/workflows/android-validation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-capture
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run both flavor unit test suites
        run: gradle testOriginalDebugUnitTest testValidationDebugUnitTest --stacktrace
      - name: Build validation debug APK without release credentials
        run: gradle assembleValidationDebug --stacktrace
      - name: Upload validation test APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Finance-XP-Validation-UNSIGNED-TEST
          path: android-capture/app/build/outputs/apk/validation/debug/app-validation-debug.apk
          if-no-files-found: error
          retention-days: 14
