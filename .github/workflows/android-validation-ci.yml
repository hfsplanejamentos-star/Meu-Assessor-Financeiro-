name: Android Validation CI

on:
  pull_request:
    paths:
      - "android-capture/**"
      - ".github/workflows/android-validation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-capture
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run both flavor unit test suites
        run: gradle testOriginalDebugUnitTest testValidationDebugUnitTest --stacktrace
      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Finance-Android-Unit-Test-Reports
          path: android-capture/app/build/test-results/**/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Build validation debug APK without release credentials
        run: gradle assembleValidationDebug --stacktrace
      - name: Verify isolated validation package identity
        run: |
          APK="app/build/outputs/apk/validation/debug/app-validation-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='br.com.snakefinance.app.validation'"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
      - name: Upload validation test APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Finance-XP-Validation-DEBUG-SIGNED-TEST
          path: android-capture/app/build/outputs/apk/validation/debug/app-validation-debug.apk
          if-no-files-found: error
          retention-days: 14
