name: Check mobile migration
on:
  pull_request:
    paths:
      - 'android-capture/**'
      - 'convex/**'
      - 'migration/**'
      - 'scripts/stage-mobile-v82.mjs'
      - 'tests/whatsapp-migration.test.mjs'
      - 'package*.json'
      - '.github/workflows/migration-checks.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:backend
      - run: npm run test:migration
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle testDebugUnitTest assembleDebug --stacktrace
