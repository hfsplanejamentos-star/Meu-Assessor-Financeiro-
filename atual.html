<style>
:root{
  --bg:#050912; --panel:rgba(10,20,36,.68); --panel2:rgba(12,26,46,.82);
  --line:rgba(100,190,255,.18); --cyan:#20d8ff; --blue:#4a8cff; --green:#20e7a6;
  --purple:#9a6cff; --red:#ff5876; --amber:#ffbf5a; --text:#eff6ff; --muted:#9db0c7;
  --shadow:0 18px 55px rgba(0,0,0,.38);
}
*{box-sizing:border-box} html,body{margin:0;background:
radial-gradient(circle at 82% 12%,rgba(57,80,255,.15),transparent 34%),
radial-gradient(circle at 10% 25%,rgba(0,224,255,.12),transparent 28%),
linear-gradient(145deg,#040810,#06101b 55%,#050914);color:var(--text);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:
linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;background:rgba(3,10,20,.78);display:flex;flex-direction:column;overflow:hidden;
border-right:1px solid var(--line);backdrop-filter:blur(20px);z-index:50}
.brand{display:flex;gap:12px;align-items:center;margin:0 4px 22px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#1df2ff,#5573ff 50%,#a46cff);
display:grid;place-items:center;box-shadow:0 0 30px rgba(32,216,255,.28);font-weight:900;color:white}
.brand b{display:block;letter-spacing:.05em}.brand small{color:#74dcff}
.nav{display:grid;gap:6px;overflow-y:auto;min-height:0;padding-right:4px;scrollbar-width:thin}.nav button{background:transparent;border:1px solid transparent;color:#c6d4e6;padding:11px 12px;border-radius:12px;text-align:left}
.nav button:hover,.nav button.active{color:white;background:linear-gradient(90deg,rgba(32,216,255,.15),rgba(74,140,255,.10));border-color:rgba(32,216,255,.2)}
.nav .sep{height:1px;background:var(--line);margin:10px 0}
.sidefoot{position:static;margin-top:auto;padding-top:12px;flex:0 0 auto}

.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.menu-btn{display:none;background:var(--panel);border:1px solid var(--line);color:white;border-radius:12px;padding:10px 12px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:rgba(8,18,33,.72);border:1px solid var(--line);border-radius:16px;padding:11px 14px;backdrop-filter:blur(18px)}
.search input{flex:1;background:transparent;border:none;outline:none;color:white}
.top-actions{display:flex;gap:8px}.pill{border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:var(--panel);color:#dce9fa}
.grid-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.card{background:linear-gradient(180deg,rgba(15,30,52,.72),rgba(6,14,27,.78));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
.kpi{padding:16px;min-height:126px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;width:110px;height:110px;right:-34px;top:-36px;border-radius:50%;background:radial-gradient(circle,rgba(32,216,255,.16),transparent 68%)}
.kpi .label{font-size:12px;color:#adc1d9}.kpi .value{font-size:25px;font-weight:800;margin:9px 0 5px}.up{color:var(--green)}.down{color:var(--red)}.neutral{color:var(--cyan)}
.spark{height:28px;width:100%;opacity:.9}
.dashboard{display:grid;grid-template-columns:1.55fr 1fr .85fr;gap:12px;margin-top:12px}
.span2{grid-column:span 2}.panel{padding:14px}.panel h3{font-size:15px;margin:0}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.panel-head select,.panel-head button{background:#091426;color:#d9e7f8;border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.chart-wrap{height:255px;position:relative}.chart-wrap.tall{height:300px}
canvas{width:100%;height:100%}
.tooltip{position:fixed;pointer-events:none;z-index:1000;background:#06111f;border:1px solid rgba(32,216,255,.35);color:white;padding:8px 10px;border-radius:10px;font-size:12px;box-shadow:var(--shadow);display:none}
.row-list{display:grid;gap:8px}.item{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:13px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.045)}

.item b{font-size:13px}.item small{display:block;color:var(--muted);margin-top:2px}.amount{font-weight:700;font-size:13px}
.tag{display:inline-flex;padding:3px 7px;border-radius:999px;background:rgba(74,140,255,.13);border:1px solid rgba(74,140,255,.22);font-size:10px;color:#c5d7ff}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.quick button{padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:#eaf4ff}
.quick button:hover{border-color:var(--cyan);box-shadow:0 0 24px rgba(32,216,255,.10)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:11px}.calendar div{padding:7px 2px;border-radius:9px;color:#b8c8dc}.calendar .event{background:linear-gradient(145deg,rgba(74,140,255,.32),rgba(154,108,255,.30));border:1px solid rgba(129,126,255,.35);color:white}
.legend{display:grid;gap:8px}.legend-line{display:flex;justify-content:space-between;font-size:12px;color:#c8d7e9}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.module{display:none}.module.active{display:block}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}.table th{color:#8da8c5}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:grid;gap:5px}.field label{font-size:11px;color:#9fb2c9}.field input,.field select{background:#081320;border:1px solid var(--line);color:white;border-radius:10px;padding:10px}
.primary{background:linear-gradient(135deg,#20d8ff,#4a8cff 55%,#8a6cff);color:#04111b;border:none;border-radius:12px;padding:10px 14px;font-weight:800}
.secondary{background:#081320;color:#dce9f8;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;place-items:center;z-index:200}.modal.open{display:grid}.modal-card{width:min(760px,92vw);max-height:90vh;overflow:auto;padding:18px;background:#071221;border:1px solid rgba(72,176,255,.35);border-radius:20px;box-shadow:0 35px 100px rgba(0,0,0,.6)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{background:transparent;border:none;color:white;font-size:22px}
.notice{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,191,90,.22);background:rgba(255,191,90,.06);color:#ffd99e;font-size:12px}
.mobile-overlay{display:none}
@media(max-width:1250px){.grid-kpi{grid-template-columns:repeat(3,1fr)}.dashboard{grid-template-columns:1fr 1fr}.span2{grid-column:span 2}}
@media(max-width:820px){
 .app{grid-template-columns:1fr}.sidebar{position:fixed;left:-265px;width:250px;transition:.25s;box-shadow:30px 0 80px rgba(0,0,0,.6)}
 .sidebar.open{left:0}.mobile-overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
 .main{padding:12px}.menu-btn{display:block}.grid-kpi{grid-template-columns:1fr 1fr}.dashboard{grid-template-columns:1fr}.span2{grid-column:auto}.top-actions .pill:nth-child(1){display:none}

}
