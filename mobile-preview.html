<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Assessor Financeiro · Prévia Mobile</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#102443,#020711 58%);font-family:Inter,system-ui,sans-serif;color:#fff}
body{display:grid;place-items:center;padding:14px}
.preview{text-align:center}
.preview h1{font-size:15px;margin:0 0 10px;color:#9edfff;letter-spacing:.04em}
.phone{width:390px;height:min(844px,calc(100vh - 62px));max-width:calc(100vw - 20px);border:9px solid #172337;border-radius:34px;overflow:hidden;background:#071221;box-shadow:0 25px 80px #000,0 0 36px #168cff44}
.phone iframe{display:block;width:100%;height:100%;border:0;background:#071221}
</style>
</head>
<body>
<div class="preview">
<h1>MEU ASSESSOR FINANCEIRO · MOBILE R10.17</h1>
<div class="phone"><iframe id="mobileFrame" title="Meu Assessor Mobile" src="./index.html?release=atual-r1017-phone-frame"></iframe></div>
</div>
<script>
const frame=document.getElementById('mobileFrame');
frame.addEventListener('load',()=>{const params=new URLSearchParams(location.search),focus=params.get('focus');setTimeout(()=>{if(focus){const selector=focus==='expenses'?'#categoryPanel':'[data-kpi-id="patrimony"]',target=frame.contentDocument?.querySelector(selector);target?.scrollIntoView({block:'start'});frame.contentWindow?.scrollBy(0,-8)}if(params.get('debug')==='1'){try{frame.contentWindow.FinanceCanonical?.renderCanonicalExpenseChart();setTimeout(()=>{document.title='DBG '+frame.contentWindow.eval(`JSON.stringify({activeMonth,scope:scopeMonth('category'),today:monthKey(today),chart:document.getElementById('categoryChart')?._chart?.items||[],legend:document.getElementById('categoryLegend')?.innerText||'',recurring:(db.recurring||[]).map(r=>({desc:r.desc,value:r.value,cat:r.cat,active:r.active}))})`)},350)}catch(e){document.title='DBG ERROR '+e.message}}},2200)});
</script>
</body>
</html>
