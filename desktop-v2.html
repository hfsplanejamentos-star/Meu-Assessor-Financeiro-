<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Assessor Financeiro — Desktop V2</title><style>:root{--bg:#050a12;--p:#091523;--p2:#0d1d2e;--line:#173652;--text:#edf7ff;--muted:#7f9bb5;--cyan:#21d4fd;--green:#35e0a1;--red:#ff607d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#102844 0,transparent 34%),var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:26px 18px;background:#06101bcc}.brand{font-weight:850;font-size:18px;margin-bottom:34px}.brand span{color:var(--cyan)}nav{display:grid;gap:8px}nav button{border:0;background:transparent;color:#9db3c7;text-align:left;padding:12px;border-radius:10px;font:inherit}nav button.active{background:#0d2236;color:#fff}.main{padding:28px;max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:5px}.cloud{border:1px solid #1b5574;background:#0b1d2e;color:#8ee8ff;padding:10px 14px;border-radius:12px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:linear-gradient(180deg,#0c1928e8,#08131fe8);border:1px solid var(--line);border-radius:16px;padding:17px}.label{font-size:12px;color:var(--muted)}.value{font-size:24px;font-weight:850;margin-top:10px}.grid{display:grid;grid-template-columns:1.7fr 1fr .8fr;gap:12px;margin-top:12px}.chart{height:260px;display:flex;align-items:end;gap:10px;padding-top:25px}.bar{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(#23d5fd,#2467ee);min-height:8px}.donut{width:160px;height:160px;border-radius:50%;margin:28px auto;background:conic-gradient(#21d4fd 0 38%,#8b6cff 38% 62%,#35e0a1 62% 79%,#ffbf5a 79%);display:grid;place-items:center}.donut:after{content:'Despesas';display:grid;place-items:center;width:105px;height:105px;background:#0a1725;border-radius:50%;color:var(--muted);font-size:12px}.agenda{display:grid;gap:9px;margin-top:15px}.event{padding:10px;border-left:3px solid var(--cyan);background:#0a1928;border-radius:7px;font-size:12px}.bottom{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:12px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #142b40;font-size:13px}.empty{color:var(--muted);padding:30px 0;text-align:center}@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}.grid .agendaCard{grid-column:1/-1}}@media(max-width:820px){body:before{content:'Desktop V2 foi projetado para tela de computador.';display:block;padding:20px}.app{display:none}}</style></head><body><div class="app"><aside class="side"><div class="brand">MEU <span>ASSESSOR</span><br>FINANCEIRO</div><nav><button class="active">▦ Visão Geral</button><button>↔ Transações</button><button>▣ Contas</button><button>◇ Cartões</button><button>◫ Planejamento</button><button>⌁ Investimentos</button><button>✦ Assessor IA</button></nav></aside><main class="main"><div class="top"><div><h1>Visão Geral</h1><div class="sub">Desktop V2 · mesma base financeira do Desktop Original</div></div><button class="cloud" id="cloud">☁ Cloud · carregando</button></div><section class="kpis"><div class="card"><div class="label">PATRIMÔNIO TOTAL</div><div class="value" id="pat">—</div></div><div class="card"><div class="label">DISPONÍVEL HOJE</div><div class="value" id="disp">—</div></div><div class="card"><div class="label">RECEITAS</div><div class="value" id="rec">—</div></div><div class="card"><div class="label">DESPESAS</div><div class="value" id="desp">—</div></div><div class="card"><div class="label">INVESTIMENTOS</div><div class="value" id="inv">—</div></div></section><section class="grid"><div class="card"><b>Receitas × Despesas</b><div class="sub">Visão mensal</div><div class="chart" id="bars"></div></div><div class="card"><b>Despesas por categoria</b><div class="donut"></div><div class="sub" style="text-align:center" id="expenseTotal">—</div></div><div class="card agendaCard"><b>Agenda financeira</b><div class="agenda" id="agenda"><div class="empty">Carregando compromissos…</div></div></div></section><section class="bottom"><div class="card"><b>Contas</b><div id="accounts"></div></div><div class="card"><b>Últimas transações</b><div id="txs"></div></div></section></main></div><script>const API='https://effervescent-marlin-88.convex.site/finance/state',KEY='assessor_cloud_sync_key';const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const isTransfer=t=>t.transfer||t.transferId||t.kind==='transfer'||['transferencia','transferencias'].includes(norm(t.cat));const isReversal=t=>['estorno','estornos'].includes(norm(t.cat))||t.kind==='reversal'||t.kind==='refund';const posted=t=>!t.status||['realized','posted'].includes(String(t.status).toLowerCase());function render(db,version){const accounts=db.accounts||[],tx=db.transactions||[],now=new Date(),key=now.toISOString().slice(0,7),month=tx.filter(t=>String(t.date||'').slice(0,7)===key&&posted(t)&&!isTransfer(t)&&!t.excludeFromExpense),income=month.filter(t=>Number(t.value)>0&&!isReversal(t)).reduce((s,t)=>s+Number(t.value||0),0),expense=Math.abs(month.filter(t=>Number(t.value)<0&&!isReversal(t)).reduce((s,t)=>s+Number(t.value||0),0)),pat=accounts.reduce((s,a)=>s+Number(a.balance||0),0),invest=accounts.filter(a=>norm(a.type).includes('invest')).reduce((s,a)=>s+Number(a.balance||0),0);patEl.textContent=brl(pat);disp.textContent=brl(pat-invest);rec.textContent=brl(income);desp.textContent=brl(expense);inv.textContent=brl(invest);expenseTotal.textContent=brl(expense);cloud.textContent='☁ Cloud · v'+version;window.patEl=document.getElementById('pat');accountsEl.innerHTML=accounts.length?accounts.map(a=>`<div class="row"><span>${a.name||'Conta'}</span><b>${brl(a.balance)}</b></div>`).join(''):'<div class="empty">Nenhuma conta</div>';txs.innerHTML=tx.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,7).map(t=>`<div class="row"><span>${t.desc||t.description||'Transação'}<small class="sub" style="display:block">${t.date||''} · ${t.cat||''}</small></span><b>${brl(t.value)}</b></div>`).join('');const recurring=(db.recurring||[]).filter(x=>x.active!==false).slice(0,5);agenda.innerHTML=recurring.length?recurring.map(r=>`<div class="event"><b>Dia ${r.due||'—'} · ${r.desc||'Compromisso'}</b><div class="sub">${brl(r.value)}</div></div>`).join(''):'<div class="empty">Sem compromissos cadastrados</div>';bars.innerHTML=[income,expense,Math.max(income-expense,0)].map((v,i)=>`<div class="bar" title="${brl(v)}" style="height:${Math.max(8,Math.min(100,v/Math.max(income,expense,1)*100))}%"></div>`).join('')}const accountsEl=document.getElementById('accounts'),patEl=document.getElementById('pat');(async()=>{const k=localStorage.getItem(KEY);if(!k){cloud.textContent='☁ Cloud não configurado';return}try{const r=await fetch(API,{headers:{'X-Sync-Key':k},cache:'no-store'}),x=await r.json();if(x?.state)render(x.state.payload||{},x.state.version);else cloud.textContent='☁ Sem dados'}catch(e){cloud.textContent='☁ Cloud indisponível'}})();</script></body></html>
